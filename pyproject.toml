[build-system]
requires = ["setuptools>=69", "wheel", "setuptools_scm>=6.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]

[tool.setuptools.packages.find]
include = ["quartodoc", "quartodoc.*"]

[tool.pytest.ini_options]
markers = []
testpaths = ["quartodoc"]

[project]
# note that the distribution is named quartopydoc, but the package it installs
# is still imported (and configured in _quarto.yml) as quartodoc
name = "quartopydoc"
authors = [{name="Michael Chow", email="michael.chow@posit.co"}]
maintainers = [{name="Cliff Kerr", email="cliff.kerr@gatesfoundation.org"}]
license.file = "LICENSE"
description = "Generate API documentation with Quarto. A fork of quartodoc."
readme = "README.md"
keywords = ["documentation", "quarto"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3 :: Only",
]
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = [
    "black",
    "click",
    "griffe >= 2.0",
    "sphobjinv >= 2.3.1",
    "tabulate >= 0.9.0",
    "importlib-metadata >= 5.1.0",
    "importlib-resources >= 5.10.2",
    "pydantic",
    "pyyaml",
    "requests",
    "typing-extensions >= 4.4.0",
    "watchdog >= 3.0.0",
    "plum-dispatch > 2.0.0",
    "sciris >= 3.2.0",
    "jupytext >= 1.16.0",
    "nbformat >= 5.0.0"
]

[project.urls]
homepage = "https://sciris.github.io/quartopydoc"
repository = "https://github.com/sciris/quartopydoc"
ci = "https://github.com/sciris/quartopydoc/actions"
upstream = "https://github.com/machow/quartodoc"


[project.scripts]
quartodoc = "quartodoc.__main__:cli"
qpyd = "quartodoc.qpyd:cli"
qpynb = "quartodoc.qpyd:nb_cli"

[dependency-groups]
dev = [
    "pytest<8.0.0",
    "pytest-cov",
    "jupyterlab",
    "jupytext",
    "syrupy",
    "pre-commit"
]
